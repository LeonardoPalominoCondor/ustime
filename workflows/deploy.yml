name: Publicar
on:
  push:
    branches: [main, develop]   # main = producción · develop = sitio de pruebas
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Compilar producción
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env: &env
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
          VITE_REGION: PE
      - name: Publicar producción
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with: { repoToken: '${{ secrets.GITHUB_TOKEN }}', firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}', projectId: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}', target: prod, channelId: live }
      - name: Compilar modo pruebas (datos test_*, sin emulador)
        if: github.ref == 'refs/heads/develop'
        run: npm run build:test
        env:
          <<: *env
          VITE_TEST_MODE: 'true'
          VITE_USE_EMULATOR: 'false'
      - name: Publicar sitio de pruebas
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with: { repoToken: '${{ secrets.GITHUB_TOKEN }}', firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}', projectId: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}', target: test, channelId: live }
