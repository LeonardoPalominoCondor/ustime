
name: Notificaciones push

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Entorno de destino'
        type: choice
        options:
          - test
          - prod
        default: test
        required: true

      mode:
        description: 'Modo de ejecución'
        type: choice
        options:
          - dry
          - test-push
          - normal
        default: dry
        required: true

      now:
        description: 'Hora simulada ISO (solo test + dry)'
        type: string
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev --ignore-scripts

      - name: Validar destino y modo
        env:
          INPUT_TARGET: ${{ github.event.inputs.target || 'test' }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'dry' }}
          INPUT_NOW: ${{ github.event.inputs.now || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            TARGET="prod"
            MODE="normal"
          else
            TARGET="$INPUT_TARGET"
            MODE="$INPUT_MODE"
          fi

          case "$TARGET" in
            test|prod) ;;
            *)
              echo "::error::Destino no permitido: $TARGET"
              exit 1
              ;;
          esac

          case "$MODE" in
            normal|dry|test-push) ;;
            *)
              echo "::error::Modo no permitido: $MODE"
              exit 1
              ;;
          esac

          if [ "$MODE" = "test-push" ] && [ "$TARGET" != "test" ]; then
            echo "::error::test-push solamente puede ejecutarse en test."
            exit 1
          fi

          if [ -n "$INPUT_NOW" ] && { [ "$TARGET" != "test" ] || [ "$MODE" != "dry" ]; }; then
            echo "::error::La hora simulada solo se permite en test + dry."
            exit 1
          fi

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "NOW=$INPUT_NOW" >> "$GITHUB_ENV"

      - name: Ejecutar notificaciones
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COUPLECINEMA_61657 }}
        run: |
          FLAGS=()

          if [ "$MODE" = "dry" ]; then
            FLAGS+=(--dry)
          fi

          if [ "$MODE" = "test-push" ]; then
            FLAGS+=(--test-push)
          fi

          if [ -n "$NOW" ]; then
            FLAGS+=(--now "$NOW")
          fi

          if [ "$TARGET" = "test" ]; then
            PREFIX="test_"
          else
            PREFIX=""
          fi

          echo "Entorno: $TARGET"
          echo "Modo: $MODE"
          echo "Prefijo: $PREFIX"

          node scripts/notify.mjs --prefix "$PREFIX" "${FLAGS[@]}"
