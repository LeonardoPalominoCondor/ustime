name: Pruebas
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Compilar producción
        run: npm run build
        env: { VITE_FIREBASE_API_KEY: ci, VITE_FIREBASE_PROJECT_ID: ci, VITE_FIREBASE_APP_ID: ci, VITE_FIREBASE_AUTH_DOMAIN: ci, VITE_FIREBASE_SENDER_ID: ci }
      - name: El build de producción NO debe contener herramientas de prueba
        run: "! grep -rl 'MODO PRUEBAS' dist/assets/*.js"
